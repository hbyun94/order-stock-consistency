# 로컬 인프라: Kafka(KRaft), Kafka UI, Redis, PostgreSQL 2개 (서비스별 DB 분리)
# 서비스(order/stock)는 컨테이너가 아니라 로컬에서 ./gradlew bootRun으로 띄운다.
# 사용법: cp .env.example .env && docker compose up -d

name: order-stock-consistency

services:
  kafka:
    image: apache/kafka:4.3.2
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # 단일 노드가 broker와 controller(KRaft 메타데이터 관리)를 겸한다 → ZooKeeper 불필요
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # KRaft 클러스터 식별자(22자 base64 UUID). kafka-storage.sh random-uuid로 생성한 값
      CLUSTER_ID: wt85iPZTS8mU0AzY6K3_oA
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 리스너 3개: 컨테이너 내부용(PLAINTEXT), 호스트 앱용(EXTERNAL), 컨트롤러용(CONTROLLER)
      KAFKA_LISTENERS: PLAINTEXT://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # 브로커가 1대이므로 내부 토픽 복제 계수도 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.1
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  redis:
    image: redis:8.10.3
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  order-db:
    image: postgres:18.7
    container_name: order-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME:?.env에 ORDER_DB_NAME을 설정하세요}
      POSTGRES_USER: ${ORDER_DB_USERNAME:?.env에 ORDER_DB_USERNAME을 설정하세요}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:?.env에 ORDER_DB_PASSWORD를 설정하세요}
    volumes:
      # PostgreSQL 18 이미지부터 데이터 경로가 /var/lib/postgresql/18/docker로 바뀌어 상위 디렉터리를 마운트한다
      - order-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  stock-db:
    image: postgres:18.7
    container_name: stock-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ${STOCK_DB_NAME:?.env에 STOCK_DB_NAME을 설정하세요}
      POSTGRES_USER: ${STOCK_DB_USERNAME:?.env에 STOCK_DB_USERNAME을 설정하세요}
      POSTGRES_PASSWORD: ${STOCK_DB_PASSWORD:?.env에 STOCK_DB_PASSWORD를 설정하세요}
    volumes:
      - stock-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  order-db-data:
  stock-db-data:
