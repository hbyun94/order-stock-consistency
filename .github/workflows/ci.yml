# PR이 열리거나 갱신될 때, 그리고 main에 merge될 때 빌드와 전체 테스트를 실행한다.
# - Testcontainers: GitHub 호스팅 러너(ubuntu)에는 Docker가 기본 설치돼 있어 추가 설정 없이 컨테이너를 띄운다.
# - 동시성 실험(@Tag("experiment"))은 일반 test 작업에서 제외돼 있어 여기서는 실행되지 않는다.
#   실험은 experiment-1.yml 워크플로에서 수동으로 실행한다.
name: CI

on:
  pull_request:
  push:
    branches: [main]   # main의 결과가 README 배지에 표시된다

# 같은 PR에 새 커밋이 올라오면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write          # 테스트 결과 체크(PR의 Checks 탭)
  pull-requests: write   # 테스트 결과 요약 댓글

jobs:
  build:
    name: 빌드와 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: JDK 25 설치
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # Gradle 배포판, 의존성, 빌드 캐시를 GitHub Actions 캐시에 저장해 다음 실행을 빠르게 한다.
      # 캐시는 main에서만 새로 쓰고, PR에서는 읽기만 한다(기본 동작). wrapper 검증도 함께 한다.
      - name: Gradle 설정(캐시)
        uses: gradle/actions/setup-gradle@v6

      - name: 빌드와 테스트
        run: ./gradlew build --continue

      # 테스트 결과를 PR 댓글과 Checks 탭, 실행 요약(Job Summary)에 표로 남긴다.
      # 빌드가 실패해도(테스트 실패 포함) 결과는 남겨야 하므로 always()
      - name: 테스트 결과 게시
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: 테스트 결과
          files: '**/build/test-results/test/*.xml'

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/test/
            **/build/test-results/test/
          retention-days: 7
