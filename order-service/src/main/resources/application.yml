server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    # 접속 정보는 환경 변수(.env)에서 읽는다. 호스트/포트만 로컬 기본값을 둔다.
    url: jdbc:postgresql://${ORDER_DB_HOST:localhost}:${ORDER_DB_PORT:5433}/${ORDER_DB_NAME}
    username: ${ORDER_DB_USERNAME}
    password: ${ORDER_DB_PASSWORD}
  data:
    redis:
      # 주문 요청 멱등 키 저장소
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 값은 JSON으로 보낸다. 클래스 이름을 담는 타입 헤더는 끈다: 받는 쪽은 자기 record로 읽는다 (D-028)
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
        # 브로커에 닿지 못할 때 send()가 기다리는 최대 시간(기본 60초). 주문 요청 스레드가 오래 묶이지 않게 줄인다
        max.block.ms: 5000
    consumer:
      group-id: order-service
      # 소비자 그룹이 처음 붙을 때 토픽의 처음부터 읽는다 (구독 전에 들어온 이벤트를 놓치지 않기 위함)
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 문자열로 받은 뒤, 리스너 메서드의 파라미터 타입에 맞춰 JSON을 변환한다 (KafkaConfig의 메시지 컨버터)
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  jpa:
    # 트랜잭션이 끝나면 DB 커넥션도 반납한다 (기본값 true면 HTTP 응답이 끝날 때까지 커넥션을 붙잡는다)
    open-in-view: false
    hibernate:
      # 테이블은 Flyway가 만들고, Hibernate는 엔티티와 테이블이 일치하는지 검사만 한다
      ddl-auto: validate

# 리스너 처리 실패 시 같은 자리에서 재시도한다 (D-042, D-043).
# 간격 1초부터 2배씩, 최대 8초, 재시도 4회(최초 포함 5번 시도, 약 15초). 다 실패하면 <토픽>.dlt로 보낸다 (D-045)
kafka:
  retry:
    initial-interval-ms: 1000
    multiplier: 2.0
    max-interval-ms: 8000
    max-retries: 4

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
