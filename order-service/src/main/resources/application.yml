server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    # 접속 정보는 환경 변수(.env)에서 읽는다. 호스트/포트만 로컬 기본값을 둔다.
    url: jdbc:postgresql://${ORDER_DB_HOST:localhost}:${ORDER_DB_PORT:5433}/${ORDER_DB_NAME}
    username: ${ORDER_DB_USERNAME}
    password: ${ORDER_DB_PASSWORD}
  jpa:
    # 트랜잭션이 끝나면 DB 커넥션도 반납한다 (기본값 true면 HTTP 응답이 끝날 때까지 커넥션을 붙잡는다)
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
