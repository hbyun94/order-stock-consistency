# 모든 버전을 이 파일 한 곳에서 관리한다.
# 라이브러리 버전은 Spring Boot BOM이 관리하는 값을 그대로 쓰고, 여기서는 Boot 버전만 고정한다.
[versions]
spring-boot = "4.1.3"
# Spring Boot BOM이 관리하지 않으므로 직접 고정한다 (D-001 원칙: 4.7.0, 4.8.0은 아직 패치 없음)
redisson = "4.6.1"

[libraries]
redisson-spring-boot-starter = { module = "org.redisson:redisson-spring-boot-starter", version.ref = "redisson" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
