server:
  port: 8082

spring:
  application:
    name: stock-service
  datasource:
    # 접속 정보는 환경 변수(.env)에서 읽는다. 호스트/포트만 로컬 기본값을 둔다.
    url: jdbc:postgresql://${STOCK_DB_HOST:localhost}:${STOCK_DB_PORT:5434}/${STOCK_DB_NAME}
    username: ${STOCK_DB_USERNAME}
    password: ${STOCK_DB_PASSWORD}
  jpa:
    # 트랜잭션이 끝나면 DB 커넥션도 반납한다 (기본값 true면 HTTP 응답이 끝날 때까지 커넥션을 붙잡는다)
    open-in-view: false
    hibernate:
      # 테이블은 Flyway가 만들고, Hibernate는 엔티티와 테이블이 일치하는지 검사만 한다
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
