server:
  port: 8082

spring:
  application:
    name: stock-service
  datasource:
    # 접속 정보는 환경 변수(.env)에서 읽는다. 호스트/포트만 로컬 기본값을 둔다.
    url: jdbc:postgresql://${STOCK_DB_HOST:localhost}:${STOCK_DB_PORT:5434}/${STOCK_DB_NAME}
    username: ${STOCK_DB_USERNAME}
    password: ${STOCK_DB_PASSWORD}
  data:
    redis:
      # Redisson 스타터가 이 접속 정보로 RedissonClient를 만든다 (분산 락용)
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 값은 JSON으로 보낸다. 클래스 이름을 담는 타입 헤더는 끈다: 받는 쪽은 자기 record로 읽는다 (D-028)
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: stock-service
      # 소비자 그룹이 처음 붙을 때 토픽의 처음부터 읽는다 (구독 전에 들어온 이벤트를 놓치지 않기 위함)
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 문자열로 받은 뒤, 리스너 메서드의 파라미터 타입에 맞춰 JSON을 변환한다 (KafkaConfig의 메시지 컨버터)
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  jpa:
    # 트랜잭션이 끝나면 DB 커넥션도 반납한다 (기본값 true면 HTTP 응답이 끝날 때까지 커넥션을 붙잡는다)
    open-in-view: false
    hibernate:
      # 테이블은 Flyway가 만들고, Hibernate는 엔티티와 테이블이 일치하는지 검사만 한다
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
